org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m

kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.enableCInteropCommonization=true
kotlin.js.yarn.lock.file=false
skiko.kotlin.language.version=2.2
skiko.kotlin.api.version=2.2
# kotlin.native.ForceNativeThreadState needs API version 2.4. A lower version would not widen
# compatibility: a klib carries the ABI version of the compiler that built it (KT-66755, KT-76131).
skiko.kotlin.native.language.version=2.4
skiko.kotlin.native.api.version=2.4
skiko.emsdk.version=4.0.7

# Flow's fork: <upstream skiko version>-flow.<n>, published as a release (no -SNAPSHOT) under
# org.jetbrains.skiko, so it replaces the skiko Compose asks for.
deploy.version=0.156.1-flow.5
deploy.release=true

# the GitHub repository whose releases hold the Skia prebuilts: Flow's Skia fork (flow/m<milestone>
# branches, JetBrains/skia's skiko-m<milestone> plus Ganesh GL as GLES on macOS)
dependencies.skia.repo=tiesiogdvd/skia
# a tag from https://github.com/tiesiogdvd/skia/releases; -Pskia.dir=<skia checkout> (or SKIA_DIR)
# builds against a local Skia build instead
dependencies.skia=m156-egl-66b89928c4

# a tag from https://github.com/JetBrains/angle-pack
dependencies.angle=ec4d8f8e4d

# you can override general skia dependencies by passing platform-specific property:
# dependencies.skia.android-arm64
# dependencies.skia.android-x64
# dependencies.skia.ios-arm64
# dependencies.skia.ios-x64
# dependencies.skia.iosSim-arm64
# dependencies.skia.iosSim-x64
# dependencies.skia.linux-arm64
# dependencies.skia.linux-x64
# dependencies.skia.macos-arm64
# dependencies.skia.macos-x64
# dependencies.skia.tvos-arm64
# dependencies.skia.tvosSim-arm64
# dependencies.skia.tvosSim-x64
# dependencies.skia.wasm-wasm
# dependencies.skia.windows-arm64
# dependencies.skia.windows-x64

skiko.awt.enabled=true
skiko.js.enabled=false
skiko.wasm.enabled=false
skiko.android.enabled=false
skiko.native.enabled=false
skiko.native.linux.enabled=false
skiko.native.mac.enabled=false
skiko.native.ios.enabled=false
skiko.native.ios.arm64.enabled=false
skiko.native.ios.simulatorArm64.enabled=false
skiko.native.ios.x64.enabled=false
